name: iOS source validation

on:
  pull_request:
    paths:
      - '.github/workflows/ios-source-validation.yml'
      - 'CMakeLists.txt'
      - '3rdparty/ios.cmake'
      - '3rdparty/ios/**'
      - 'buildfiles/cmake/ConfigureIOS.cmake'
      - 'buildfiles/ios/**'
      - 'rpcs3/CMakeLists.txt'
      - 'rpcs3/ios/**'
      - 'rpcs3/Input/ios_gamecontroller_pad_handler.*'
      - 'rpcs3/Emu/Io/pad_config*'
      - 'rpcs3/rpcs3qt/CMakeLists.txt'
      - 'BUILDING_IOS.md'
      - 'PORTING_IOS.md'
  push:
    branches:
      - 'agent/ios-bootstrap'
    paths:
      - '.github/workflows/ios-source-validation.yml'
      - 'CMakeLists.txt'
      - '3rdparty/ios.cmake'
      - '3rdparty/ios/**'
      - 'buildfiles/cmake/ConfigureIOS.cmake'
      - 'buildfiles/ios/**'
      - 'rpcs3/CMakeLists.txt'
      - 'rpcs3/ios/**'
      - 'rpcs3/Input/ios_gamecontroller_pad_handler.*'
      - 'rpcs3/Emu/Io/pad_config*'
      - 'rpcs3/rpcs3qt/CMakeLists.txt'
      - 'BUILDING_IOS.md'
      - 'PORTING_IOS.md'

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate shell syntax
        shell: bash
        run: |
          mkdir -p validation-logs
          set +e
          for helper in buildfiles/ios/*.sh; do
            bash -n "$helper"
          done 2>&1 | tee validation-logs/shell-syntax.log
          status=${PIPESTATUS[0]}
          echo "$status" > validation-logs/shell-syntax.status
          exit 0

      - name: Validate general iOS source contracts
        shell: bash
        run: |
          set +e
          python3 buildfiles/ios/validate_sources.py 2>&1 | tee validation-logs/general.log
          status=${PIPESTATUS[0]}
          echo "$status" > validation-logs/general.status
          exit 0

      - name: Validate core and final-link contracts
        shell: bash
        run: |
          set +e
          python3 buildfiles/ios/validate_core.py 2>&1 | tee validation-logs/core.log
          status=${PIPESTATUS[0]}
          echo "$status" > validation-logs/core.status
          exit 0

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-source-validation-logs
          path: validation-logs
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validator results
        if: always()
        shell: bash
        run: |
          failed=0
          for status_file in validation-logs/*.status; do
            if [[ "$(cat "$status_file")" != "0" ]]; then
              echo "failure: ${status_file}"
              failed=1
            fi
          done
          exit "$failed"
