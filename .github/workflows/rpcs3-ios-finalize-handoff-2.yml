name: Finalize RPCS3 iOS handoff 2

on:
  push:
    branches: [ios-emulator-improvements-2026-09-10]
    paths: ['.github/workflows/rpcs3-ios-finalize-handoff-2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Produce final clean branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='ios-emulator-improvements-2026-09-10'
          base='b6c012a5d95be805c3351a4953f460d8731087d0'
          exact='074b1471ca730af3fb804ad753a0653cd9f68383'
          tree='dadbd25411bf0ee89dbfeda1c8fa23159c4954ae'
          lease="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"

          if git cat-file -e "${exact}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$exact" "$parent"; then
            git push --force-with-lease="refs/heads/${branch}:${lease}" origin "${exact}:refs/heads/${branch}"
            exit 0
          fi
          git merge-base --is-ancestor "$base" "$parent"

          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; tree='dadbd25411bf0ee89dbfeda1c8fa23159c4954ae'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'rpcs3-ios-finalizer'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r: return json.load(r)
          t=get(f'https://api.github.com/repos/{repo}/git/trees/{tree}?recursive=1')
          es=sorted((e for e in t['tree'] if e.get('path','').startswith('.push-rpcs3-ios/part-') and e.get('type')=='blob'),key=lambda e:e['path'])
          if len(es)<11: raise SystemExit('replay chunks missing')
          b=bytearray()
          for e in es: b.extend(base64.b64decode(get(f'https://api.github.com/repos/{repo}/git/blobs/{e["sha"]}')['content']))
          open('/tmp/replay.mbox','wb').write(base64.b64decode(b,validate=True))
          PY

          rm -rf /tmp/mails; mkdir /tmp/mails
          git mailsplit --mboxrd -d4 -o/tmp/mails /tmp/replay.mbox >/dev/null
          git reset --hard "$base"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          applied=0
          while IFS= read -r m; do
            if ! tail -n 8 "$m" | grep -qx '2\.47\.3'; then break; fi
            git am --3way "$m"
            applied=$((applied+1))
          done < <(find /tmp/mails -maxdepth 1 -type f -printf '%p\n' | sort)
          test "$applied" -ge 8

          cat > IOS_RUNTIME_HARDENING.md <<'DOC'
          # RPCS3 iOS runtime hardening report

          This branch contains the iOS runtime hardening work developed from base commit `19be56402314cf5a3fef7ad93027b00c7077ad29`.

          Runtime changes include native RemoteIO audio and lifecycle recovery, capability-aware CPU decoder fallback, pause ownership across iOS activity transitions, stable controller slots and game-view-scoped touch controls, NaN-safe PCM conversion with ARM64 NEON, ARC/PCH isolation, confined native-audio exception support, and reproducible PCM/runtime policy tests.

          Portable GCC Release and Clang sanitizer suites passed during development, together with Python source-contract and AArch64 code-generation checks. Xcode/Apple-SDK builds and physical-device audio, compatibility, thermal, memory-pressure, controller, and sustained-performance acceptance still require Apple hardware.
          DOC
          mkdir -p .github/workflows
          cat > .github/workflows/ios-runtime-ci.yml <<'YAML'
          name: iOS runtime policies
          on:
            push:
              branches: [ios-emulator-improvements-2026-09-10]
            pull_request:
          permissions:
            contents: read
          jobs:
            portable-runtime-tests:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: cmake -S buildfiles/ios/tests -B build/ios-tests -DCMAKE_BUILD_TYPE=Release
                - run: cmake --build build/ios-tests --parallel 2
                - run: ctest --test-dir build/ios-tests --output-on-failure
            clang-sanitizers:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - env: {CC: clang, CXX: clang++}
                  run: cmake -S buildfiles/ios/tests -B build/ios-sanitized -DCMAKE_BUILD_TYPE=Debug -DRPCS3_IOS_TEST_SANITIZERS=ON
                - run: cmake --build build/ios-sanitized --parallel 2
                - run: ctest --test-dir build/ios-sanitized --output-on-failure
            apple-bridge-syntax:
              runs-on: macos-latest
              steps:
                - uses: actions/checkout@v4
                - run: bash buildfiles/ios/check_apple_bridges.sh
          YAML
          git add IOS_RUNTIME_HARDENING.md .github/workflows/ios-runtime-ci.yml
          if ! git diff --cached --quiet; then git commit -m 'test/docs: finalize iOS runtime validation handoff'; fi
          for f in .github/workflows/rpcs3-ios-replay.yml .github/workflows/rpcs3-ios-replay-guard.yml .github/workflows/rpcs3-ios-finalize-handoff.yml .github/workflows/rpcs3-ios-finalize-handoff-2.yml; do test ! -e "$f"; done
          git push --force-with-lease="refs/heads/${branch}:${lease}" origin "HEAD:refs/heads/${branch}"
