name: RPCS3 iOS history replay

on:
  push:
    branches:
      - ios-emulator-improvements-2026-09-10
    paths:
      - '.github/workflows/rpcs3-ios-replay.yml'

permissions:
  contents: write

concurrency:
  group: rpcs3-ios-history-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.repository == 'phakoda/rpcs3-ios'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay validated local commits and remove handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='ios-emulator-improvements-2026-09-10'
          expected_parent='b6c012a5d95be805c3351a4953f460d8731087d0'
          expected_final_tree='2bc36450f26f57251308b122f5ea521dcb8062b5'
          bundle_tree='dadbd25411bf0ee89dbfeda1c8fa23159c4954ae'
          lease_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          parent_tree="$(git rev-parse "${parent_sha}^{tree}")"

          # If an exact-object direct push already succeeded, this commit is only
          # a temporary trigger. Remove it and leave that validated tree untouched.
          if [[ "$parent_tree" == "$expected_final_tree" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${lease_sha}" origin "${parent_sha}:refs/heads/${branch}"
            exit 0
          fi

          test "$parent_sha" = "$expected_parent"

          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          tree_sha = 'dadbd25411bf0ee89dbfeda1c8fa23159c4954ae'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rpcs3-ios-history-replay',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          tree = get(f'https://api.github.com/repos/{repo}/git/trees/{tree_sha}?recursive=1')
          entries = sorted(
              (e for e in tree['tree'] if e.get('path', '').startswith('.push-rpcs3-ios/part-') and e.get('type') == 'blob'),
              key=lambda e: e['path'],
          )
          if len(entries) < 11:
              raise SystemExit(f'expected at least 11 replay chunks, got {len(entries)}')
          encoded = bytearray()
          for entry in entries:
              blob = get(f'https://api.github.com/repos/{repo}/git/blobs/{entry["sha"]}')
              encoded.extend(base64.b64decode(blob['content']))
          with open('/tmp/replay-prefix.mbox', 'wb') as f:
              f.write(base64.b64decode(encoded, validate=True))
          PY

          rm -rf /tmp/mails && mkdir -p /tmp/mails
          git mailsplit --mboxrd -d4 -o/tmp/mails /tmp/replay-prefix.mbox >/dev/null
          git reset --hard "$expected_parent"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'

          applied=0
          while IFS= read -r mail; do
            # A truncated final message has no format-patch signature. Apply every
            # complete local commit present in the staged prefix, never a partial one.
            if ! tail -n 8 "$mail" | grep -qx '2\.47\.3'; then
              break
            fi
            git am --3way "$mail"
            applied=$((applied + 1))
          done < <(find /tmp/mails -maxdepth 1 -type f -printf '%p\n' | sort)

          test "$applied" -ge 8
          echo "Replayed ${applied} complete local commits from the staged prefix."
          git push --force-with-lease="refs/heads/${branch}:${lease_sha}" origin "HEAD:refs/heads/${branch}"
